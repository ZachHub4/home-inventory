{% extends "base.html" %}
{% block title %}Edit Item - Home Inventory{% endblock %}
{% block content %}
  <h1>Edit Item</h1>
  <form class="form" method="post" enctype="multipart/form-data">
    <label>Name
      <input type="text" name="name" value="{{ item['name'] }}" required autofocus>
    </label>
    <label>Quantity
      <input type="number" name="quantity" value="{{ item['quantity'] }}" min="1">
    </label>
    <label>Description
      <textarea name="description">{{ item['description'] or '' }}</textarea>
    </label>
    <label>Bin
      <select name="bin_id">
        {% for b in bins %}
          <option value="{{ b['id'] }}" {{ 'selected' if b['id'] == item['bin_id'] }}>
            {{ b['name'] }}{% if b['location_name'] %} ({{ b['location_name'] }}){% endif %}
          </option>
        {% endfor %}
      </select>
    </label>

    {% if item['photo'] %}
      <div class="current-photo">
        <span class="photo-label">Current photo</span>
        <button type="button" class="photo-btn"
                data-photo="{{ url_for('static', filename='uploads/' ~ item['photo']) }}"
                data-photo-alt="{{ item['name'] }}">
          <img src="{{ url_for('static', filename='uploads/' ~ item['photo'].rsplit('.', 1)[0] ~ '_thumb.jpg') }}" alt="{{ item['name'] }}">
        </button>
        <label class="checkbox-row">
          <input type="checkbox" name="remove_photo" value="1"> Remove this photo
        </label>
      </div>
      {% if not demo %}
      <label>Replace photo
        <span class="field-hint">Camera or photo library</span>
        <input type="file" name="photo" accept="image/*">
      </label>
      {% endif %}
    {% elif not demo %}
      <label>Add photo
        <span class="field-hint">Camera or photo library</span>
        <input type="file" name="photo" accept="image/*">
      </label>
    {% endif %}

    <button type="submit">Save</button>
    <a class="btn" href="{{ url_for('bin_detail', code=item['bin_code']) }}">Cancel</a>
  </form>
{% endblock %}
