{% extends "base.html" %}
{% block title %}Scan QR - Home Inventory{% endblock %}
{% block content %}
  <h1>Scan a Bin QR Code</h1>
  <p class="scan-hint">Point your camera at a bin's QR label.</p>
  <div id="scan-status" class="scan-status">Requesting camera access&hellip;</div>
  <video id="scan-video" class="scan-video" playsinline muted></video>
  <canvas id="scan-canvas" style="display:none"></canvas>
  <script src="{{ url_for('static', filename='js/jsQR.js') }}"></script>
  <script src="{{ url_for('static', filename='js/scan.js') }}"></script>
{% endblock %}
